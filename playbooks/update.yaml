---
- hosts: www

  tasks:
  - name: install git
    apt:
      name: git
      state: present
    become: true

  - name: install pip
    apt:
      name: python3-pip
      state: present
    become: true

  - name: install virtualenv
    pip:
      name: virtualenv
    become: true

  - name: setup davidbieber.com
    git: repo=https://github.com/dbieber/davidbieber.com dest=/home/dbieber/davidbieber.com version=deploy force=true
    become: true

  - name: install python dependencies
    pip:
      requirements: /home/dbieber/davidbieber.com/requirements.txt
      virtualenv: /home/dbieber/davidbieber.com/virtualenv
    become: true

  - name: get files ready to serve
    # `cp -r` is additive: pages removed from a Hugo build (e.g. drafted content
    # or paginated pages that no longer exist) used to linger in default/ as stale
    # orphans served forever. The legacy site assets in default/ (cv.pdf, /games/,
    # galleria, etc.) are git-tracked and restored by the `setup davidbieber.com`
    # task above (force=true), whereas copied Hugo output is untracked. So
    # `git clean` removes only the previous build's output, then we copy the fresh
    # build on top.
    shell: |
      git clean -fd default/
      cp -r hugo/public/* default/
    become: true
    args:
      chdir: /home/dbieber/davidbieber.com

  - name: start server app.py
    shell: nohup ./virtualenv/bin/python -m app --port 443 --redirect &
    become: true
    args:
      chdir: /home/dbieber/davidbieber.com

